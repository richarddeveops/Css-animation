<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root { --t: 12s; } /* one clock for every layer. Change it here only. */

        body {
            background-color: lightgray;
            background-image: url("./asset/wallpaperflare.com_wallpaper.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* LAYER 1: sideways movement + the car's home position */
        .car-x {
            position: absolute;
            top: 59%;
            left: 5vw;                      /* the starting spot */
            width: clamp(90px, 14vw, 170px);/* scales on phones */
            animation: move-x var(--t) infinite;
        }
        /* LAYER 2: height */
        .car-y    { animation: move-y var(--t) infinite; }
        /* LAYER 3: tilt */
        .car-tilt { animation: tilt   var(--t) infinite; }

        .car-tilt img {
            /* width: 100%; */
            display: block;
            animation: turn var(--t) infinite; /* flips to face left on the way back */
        }

        /* Each keyframe's timing-function controls the stretch AFTER it. */

        @keyframes move-x {
            0%   { transform: translateX(0);    animation-timing-function: linear; }       /* rest at start */
            10%  { transform: translateX(0);    animation-timing-function: ease-in; }      /* pull away */
            20%  { transform: translateX(6vw);  animation-timing-function: linear; }       /* cruising speed (same through the air) */
            65%  { transform: translateX(62vw); animation-timing-function: ease-out; }     /* touchdown, then brake */
            75%  { transform: translateX(68vw); animation-timing-function: linear; }       /* stopped */
            82%  { transform: translateX(68vw); animation-timing-function: ease-in-out; }  /* turned around, now drive back */
            100% { transform: translateX(0); }                                             /* exactly where it began */
        }

        @keyframes move-y {
            0%, 35% { transform: translateY(0);     animation-timing-function: ease-out; } /* wheels on road */
            50%     { transform: translateY(-30vh); animation-timing-function: ease-in; }  /* top of the arc */
            65%, 100% { transform: translateY(0); }                                        /* landed */
        }

        @keyframes tilt {
            0%, 33% { transform: rotate(0deg);   animation-timing-function: ease-in-out; }
            42%     { transform: rotate(-14deg); animation-timing-function: ease-in-out; } /* nose up */
            50%     { transform: rotate(0deg);   animation-timing-function: ease-in-out; } /* level at the top */
            58%     { transform: rotate(12deg);  animation-timing-function: ease-in-out; } /* nose down */
            65%     { transform: rotate(3deg);   animation-timing-function: ease-in-out; } /* touchdown */
            70%, 100% { transform: rotate(0deg); }
        }

        @keyframes turn {
            0%, 77%   { transform: scaleX(1); }   /* facing right */
            78%, 99%  { transform: scaleX(-1); }  /* facing left for the drive back */
            100%      { transform: scaleX(1); }   /* faces right again for the loop */
        }
    </style>
</head>
<body>
    <div class="car-x">
        <div class="car-y">
            <div class="car-tilt">
                <img src="./asset/images-removebg-preview.png" alt="Flying car">
            </div>
        </div>
    </div>
</body>
</html>
